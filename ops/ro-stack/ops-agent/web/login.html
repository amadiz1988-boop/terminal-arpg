<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101922" />
    <title>管理員登入｜鬼島傳說</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" type="module"></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <p class="eyebrow">GHOST ISLAND OPERATIONS</p>
        <h1 id="loginTitle">管理員登入</h1>
        <p class="login-copy">登入後可從手機查看伺服器、角色執行狀態與事故紀錄。</p>
        <form id="loginForm">
          <label>
            <span>管理員帳號</span>
            <input id="username" name="username" autocomplete="username" value="admin" required />
          </label>
          <label>
            <span>密碼</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" id="loginButton">安全登入</button>
        </form>
        <p id="loginStatus" class="login-status" aria-live="polite"></p>
        <p class="footer-note">目前僅提供唯讀監控，不提供伺服器或角色控制。</p>
      </section>
    </main>
  </body>
</html>
